{% extends 'service/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="text-center mb-4">
            <h1 class="text-center mb-4" style="color: #667eea;">
                <i class="fas fa-file-import mr-2"></i>导入问题记录
            </h1>
            <p class="text-muted">请选择Excel文件导入问题记录数据</p>
        </div>
        
        <form id="importForm" method="post" enctype="multipart/form-data" class="bg-white p-5 rounded-lg shadow">
            {% csrf_token %}
            
            <div class="form-group mb-4">
                <label for="file" class="form-label font-weight-bold">选择Excel文件</label>
                <div class="custom-file">
                    <input type="file" class="custom-file-input" id="file" name="file" accept=".xlsx,.xls,.csv" onchange="updateFileName(this)">
                    <label class="custom-file-label" for="file">选择文件</label>
                </div>
                <small class="form-text text-muted mt-2">
                    <i class="fas fa-info-circle mr-1"></i>支持 .xlsx、.xls 和 .csv 格式的文件
                </small>
                <div class="mt-3">
                    <a href="{% url 'service:problem_import' customer_id=customer_id %}?action=download_template" class="btn btn-outline-info btn-sm">
                        <i class="fas fa-download mr-1"></i>下载导入模板
                    </a>
                </div>
            </div>
            
            <div class="form-group mb-4">
                <div class="p-4 bg-light rounded-lg">
                    <h6 class="font-weight-bold mb-2"><i class="fas fa-exclamation-circle mr-1"></i>导入说明</h6>
                    <ul class="list-unstyled text-sm">
                        <li class="mb-1"><i class="fas fa-check-circle text-success mr-1"></i>文件格式必须为Excel</li>
                        <li class="mb-1"><i class="fas fa-check-circle text-success mr-1"></i>请确保数据格式正确</li>
                        <li class="mb-1"><i class="fas fa-check-circle text-success mr-1"></i>导入过程可能需要一些时间</li>
                    </ul>
                </div>
            </div>
            
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary btn-block" style="transition: all 0.3s ease;">
                    <i class="fas fa-upload mr-2"></i>开始导入
                </button>
                <a href="{% url 'service:problem_list' customer_id=customer_id %}" class="btn btn-secondary btn-block ml-3" style="transition: all 0.3s ease;">
                    <i class="fas fa-times mr-2"></i>取消
                </a>
            </div>
        </form>
    </div>
</div>

<script>
function updateFileName(input) {
    const fileName = input.files[0]?.name || '选择文件';
    const label = input.nextElementSibling;
    label.textContent = fileName;
}

// 处理表单提交
document.getElementById('importForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const xhr = new XMLHttpRequest();
    
    xhr.open('POST', this.action, true);
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    
    xhr.onload = function() {
        if (xhr.status === 200) {
            const response = JSON.parse(xhr.responseText);
            if (response.success) {
                let message = response.message;
                if (response.errors && response.errors.length > 0) {
                    message += '\n\n失败原因：\n' + response.errors.join('\n');
                }
                alert(message);
                if (response.redirect_url) {
                    window.location.href = response.redirect_url;
                }
            } else {
                alert(response.message);
            }
        }
    };
    
    xhr.onerror = function() {
        alert('导入失败，请重试');
    };
    
    xhr.send(formData);
});
</script>
{% endblock %}
