{% extends 'service/base.html' %}

{% block content %}
<div class="container">
    <h1>确认删除客户</h1>
    <p>您确定要删除客户 <strong>{{ object.name }}</strong> 吗？</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">确认删除</button>
        <a href="{% url 'service:customer_list' %}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
