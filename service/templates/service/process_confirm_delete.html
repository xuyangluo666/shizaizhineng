{% extends 'service/base.html' %}

{% block content %}
<div class="container">
    <h1>确认删除流程</h1>
    <p>您确定要删除流程 "{{ object.name }}" 吗？</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">确认删除</button>
        <a href="{% url 'service:process_list' object.project.id %}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
