{% extends 'service/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h3>忘记密码</h3>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    <form method="post" action="{% url 'service:password_reset' %}">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="email">邮箱</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                            <small class="form-text text-muted">请输入您注册时使用的邮箱，我们将发送密码重置链接到该邮箱</small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">发送重置链接</button>
                    </form>
                    <div class="mt-3 text-center">
                        <p><a href="{% url 'service:login' %}">返回登录</a></p>
                        <p>没有账号？<a href="{% url 'service:register' %}">立即注册</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
