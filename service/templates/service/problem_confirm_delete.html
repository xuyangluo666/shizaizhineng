{% extends 'service/base.html' %}

{% block content %}
<div class="container">
    <div class="card shadow-lg p-5">
        <h1 class="text-center mb-5">确认删除</h1>
        <p class="text-center mb-5">您确定要删除问题 "{{ object.title }}" 吗？</p>
        <form method="post" class="text-center">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-4">
                <button type="submit" class="btn btn-danger btn-lg px-5">删除</button>
                <a href="{% url 'service:problem_list' object.customer.id %}" class="btn btn-secondary btn-lg px-5">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
