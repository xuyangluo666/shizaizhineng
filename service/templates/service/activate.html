<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号激活 - RPA售后服务管理系统</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

{% block content %}
<style>
    .activate-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 0 5%;
    }
    .activate-left {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }
    .system-name {
        font-size: 3rem;
        font-weight: 700;
        text-align: center;
        line-height: 1.2;
    }
    .system-tagline {
        font-size: 1.2rem;
        margin-top: 1rem;
        opacity: 0.9;
        text-align: center;
    }
    .activate-right {
        width: 450px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }
    .activate-card {
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        overflow: hidden;
    }
    .activate-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 1.5rem;
        text-align: center;
    }
    .activate-body {
        padding: 2rem;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 8px;
        padding: 0.75rem;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .activate-footer {
        margin-top: 1.5rem;
        text-align: center;
    }
    .activate-footer a {
        color: #667eea;
        text-decoration: none;
        transition: color 0.3s ease;
    }
    .activate-footer a:hover {
        color: #764ba2;
        text-decoration: underline;
    }
    .welcome-text {
        max-width: 500px;
    }
    .welcome-text h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        font-weight: 700;
    }
    .welcome-text p {
        font-size: 1.2rem;
        opacity: 0.9;
    }
</style>
<div class="activate-container">
    <!-- 左侧系统名称 -->
    <div class="activate-left">
        <div>
            <div class="system-name">RPA售后服务管理系统</div>
            <div class="system-tagline">高效管理客户服务，提升企业效率</div>
        </div>
    </div>
    <!-- 右侧激活表单 -->
    <div class="activate-right">
        <div class="activate-card">
            <div class="activate-header">
                <h3>账号激活</h3>
            </div>
            <div class="activate-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                <p class="text-center mb-4">请点击下方按钮激活您的账号</p>
                <form method="post" action="{% url 'service:activate' uidb64=uidb64 token=token %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary w-100">激活账号</button>
                </form>
                <div class="activate-footer">
                    <p><a href="{% url 'service:login' %}">返回登录</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
