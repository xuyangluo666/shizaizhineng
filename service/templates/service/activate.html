{% extends 'service/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h3>账号激活</h3>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    <p class="text-center mb-4">请点击下方按钮激活您的账号</p>
                    <form method="post" action="{% url 'service:activate' uidb64=uidb64 token=token %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary w-100">激活账号</button>
                    </form>
                    <div class="mt-3 text-center">
                        <p><a href="{% url 'service:login' %}">返回登录</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
