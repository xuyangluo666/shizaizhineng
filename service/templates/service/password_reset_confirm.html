{% extends 'service/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h3>重置密码</h3>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    <form method="post" action="{% url 'service:password_reset_confirm' uidb64=uidb64 token=token %}">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="password1">新密码</label>
                            <input type="password" class="form-control" id="password1" name="password1" required minlength="8">
                            <small class="form-text text-muted">密码长度至少8位</small>
                        </div>
                        <div class="form-group mb-3">
                            <label for="password2">确认新密码</label>
                            <input type="password" class="form-control" id="password2" name="password2" required minlength="8">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">重置密码</button>
                    </form>
                    <div class="mt-3 text-center">
                        <p><a href="{% url 'service:login' %}">返回登录</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
