<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 实在智能KA客户服务管理系统</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

{% block content %}
<style>
    .confirm-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 0 5%;
    }
    .confirm-left {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }
    .system-name {
        font-size: 3rem;
        font-weight: 700;
        text-align: center;
        line-height: 1.2;
    }
    .system-tagline {
        font-size: 1.2rem;
        margin-top: 1rem;
        opacity: 0.9;
        text-align: center;
    }
    .confirm-right {
        width: 450px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }
    .confirm-card {
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        overflow: hidden;
    }
    .confirm-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 1.5rem;
        text-align: center;
    }
    .confirm-body {
        padding: 2rem;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-control {
        border-radius: 8px;
        padding: 0.75rem;
        border: 1px solid #e0e0e0;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 8px;
        padding: 0.75rem;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .confirm-footer {
        margin-top: 1.5rem;
        text-align: center;
    }
    .confirm-footer a {
        color: #667eea;
        text-decoration: none;
        transition: color 0.3s ease;
    }
    .confirm-footer a:hover {
        color: #764ba2;
        text-decoration: underline;
    }
    .welcome-text {
        max-width: 500px;
    }
    .welcome-text h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        font-weight: 700;
    }
    .welcome-text p {
        font-size: 1.2rem;
        opacity: 0.9;
    }
</style>
<div class="confirm-container">
    <!-- 左侧系统名称 -->
    <div class="confirm-left">
        <div>
            <div class="system-name">实在智能KA客户服务管理系统</div>
            <div class="system-tagline">高效管理客户服务，提升企业效率</div>
        </div>
    </div>
    <!-- 右侧密码重置确认表单 -->
    <div class="confirm-right">
        <div class="confirm-card">
            <div class="confirm-header">
                <h3>重置密码</h3>
            </div>
            <div class="confirm-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                <form method="post" action="{% url 'service:password_reset_confirm' uidb64=uidb64 token=token %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="password1">新密码</label>
                        <input type="password" class="form-control" id="password1" name="password1" required minlength="8">
                        <small class="form-text text-muted">密码长度至少8位</small>
                    </div>
                    <div class="form-group">
                        <label for="password2">确认新密码</label>
                        <input type="password" class="form-control" id="password2" name="password2" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">重置密码</button>
                </form>
                <div class="confirm-footer">
                    <p><a href="{% url 'service:login' %}">返回登录</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
